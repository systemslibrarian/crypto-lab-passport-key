# Grouped so an ecosystem's routine bumps arrive as ONE pull request instead of
# one per dependency. Ungrouped, this fleet opened 1,461 PRs across 176 repos,
# none of them with any CI signal because the only workflow fired on push.
#
# Majors are deliberately left OUT of the npm group. When the 2026-08-18
# backlog was landed by hand, 109 bumps had to be held back and they were
# overwhelmingly majors; grouping a breaking major together with the safe bumps
# makes the whole pull request unmergeable, which is the hand-unpicking this
# exists to prevent. Two that matter to this lab specifically: TypeScript 7
# stops tolerating an undeclared side-effect import, so `src/vite-env.d.ts` is
# load-bearing here, and Vitest 4 enforces timeouts by elapsed time rather than
# by racing a timer — which is why the 20-trial search test in
# `src/bac/search.test.ts` carries an explicit 120s budget with the measurement
# that justifies it.
#
# github-actions majors ARE grouped: checkout v4->v7, setup-node v4->v7 and the
# Pages v5/v6 jumps were verified green across the fleet on 2026-08-18.
#
# The minor/patch group and the actions group auto-merge once this lab's own
# gate passes on the PR -- see the dependabot-auto-merge job in deploy.yml.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
